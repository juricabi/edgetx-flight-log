name: Release

# Builds a zip laid out like the SD card and publishes it as a release.
# Either push a tag such as v1.1, whose annotation becomes the release notes,
# or use Run workflow on the Actions tab and type the version and notes there.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, such as v1.1
        required: true
      notes:
        description: What changed, shown above the install steps
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version || github.ref_name }}
      NOTES: ${{ inputs.notes }}
      PACKAGE: edgetx-flight-log-${{ inputs.version || github.ref_name }}.zip
    steps:
      - uses: actions/checkout@v5

      - name: Build the zip
        run: |
          mkdir -p sd/SCRIPTS/TOOLS
          cp flightlog.lua sd/SCRIPTS/TOOLS/
          cd sd && zip -r -X "../$PACKAGE" .

      - name: Write the release notes
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            # checkout fetches the tag as a bare commit, so get the annotation itself
            git fetch --force --depth=1 origin "+$GITHUB_REF:$GITHUB_REF"
            if [ "$(git cat-file -t "$VERSION")" = tag ]; then
              git tag -l --format='%(contents)' "$VERSION" > notes.md
            fi
          else
            printf '%s\n' "$NOTES" > notes.md
          fi
          cat >> notes.md <<EOF

          ## Install

          1. Download **$PACKAGE** below.
          2. Extract it to the root of the SD card. It adds \`SCRIPTS/TOOLS/flightlog.lua\`.
          3. On the radio: **SYS → Tools → Flight log**.

          Logging has to be switched on for the sensors you want to see, a sensor that is not logged is not in the file.
          EOF

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$VERSION" "$PACKAGE" --target "$GITHUB_SHA" --title "Flight Log ${VERSION#v}" --notes-file notes.md
